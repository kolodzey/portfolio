<section class="intro text-center container-l m-middle">
  <h1>{{ title }}</h1>
  <div class="container-m text-center m-middle">
    @if (!isArray(text)) {
      <p>{{ text }}</p>
    } @else {
      <p>
        @for (item of text; track $index; let isLast = $last) {
          <span>
            {{ item }}
            @if (!isLast) {
              <span><br /><br /></span>
            }
          </span>
        }
      </p>
    }
  </div>
</section>
